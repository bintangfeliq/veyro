<!DOCTYPE html>
<html lang="id" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Riwayat Transaksi - Veyro</title>
    <link rel="icon" type="image/png" th:href="@{/images/logoBrow.png}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/admin.css}">
</head>

<body>

    <div class="admin-layout">
        <div th:replace="~{admin/fragments :: sidebar('transaksi')}"></div>
        <div th:replace="~{admin/fragments :: overlay}"></div>

        <div class="admin-main">
            <div
                th:replace="~{admin/fragments :: header('Transaksi Produk', 'Daftar riwayat semua pesanan dan struk Penjualan')}">
            </div>

            <div class="admin-content">
                <div class="content-card">
                    <div class="card-header-clean">
                        <div class="card-title-group">
                            <h3 class="card-title">Daftar Seluruh Transaksi</h3>
                            <p class="card-subtitle">Semua riwayat transaksi kasir</p>
                        </div>
                    </div>

                    <div th:if="${#lists.isEmpty(semuaTransaksi)}" class="empty-state">
                        <img th:src="@{/images/transaksikosong.png}" src="/images/transaksikosong.png" alt="Belum Ada Transaksi" class="empty-img">
                        <div class="empty-title">Belum Ada Transaksi</div>
                        <div class="empty-subtitle">Transaksi yang dilakukan oleh kasir akan tercatat di sini</div>
                    </div>

                    <div th:if="${!#lists.isEmpty(semuaTransaksi)}" class="table-responsive">
                        <table class="veyro-table">
                            <thead>
                                <tr>
                                    <th>ID</th>
                                    <th>Tanggal</th>
                                    <th>Kasir</th>
                                    <th>Total</th>
                                    <th>Aksi</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="trx : ${semuaTransaksi}">
                                    <td class="font-mono text-mint" th:text="${trx.id}">1</td>
                                    <td th:text="${#temporals.format(trx.tanggal, 'dd MMM yyyy HH:mm')}">20 Okt 2026
                                    </td>
                                    <td>
                                        <span class="badge-subtle"
                                            th:text="${trx.user != null ? trx.user.username : 'Kasir'}">Kasir</span>
                                    </td>
                                    <td class="fw-bold"
                                        th:text="'Rp ' + ${#numbers.formatDecimal(trx.total, 0, 'POINT', 0, 'COMMA')}">
                                        Rp 0</td>
                                    <td>
                                        <a th:href="@{/transaksi/{id}(id=${trx.id})}" class="btn-restock">
                                            <i class="bi bi-receipt"></i>
                                            <span>Detail</span>
                                        </a>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <th:block th:replace="~{admin/fragments :: scripts}"></th:block>

</body>

</html>
