<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<body>

    <aside th:fragment="sidebar(activeMenu)" class="admin-sidebar" id="adminSidebar">
        <div class="sidebar-top-header">
            <a th:href="@{/admin/dashboard}" class="sidebar-logo-link"><img th:src="@{/images/sideAtas.png}" alt="Veyro Logo" class="sidebar-logo-img"></a>
        </div>

        <div class="sidebar-curve-body">
            <div>

                <div class="sidebar-nav">
                    <ul class="sidebar-menu">
                        <li class="sidebar-item" th:classappend="${activeMenu == 'dashboard' ? 'active' : ''}">
                            <a th:href="@{/admin/dashboard}"><i class="bi bi-grid-1x2"></i>
                                <span>Dashboard</span></a>
                        </li>
                        <li class="sidebar-item" th:classappend="${activeMenu == 'transaksi' ? 'active' : ''}">
                            <a th:href="@{/admin/transaksi}"><i class="bi bi-receipt"></i><span>Riwayat Transaksi</span>
                            </a>
                        </li>
                        <li class="sidebar-item" th:classappend="${activeMenu == 'produk' ? 'active' : ''}">
                            <a th:href="@{/product}"><i class="bi bi-box-seam"></i><span>Daftar Produk</span></a>
                        </li>
                        <li class="sidebar-item" th:classappend="${activeMenu == 'kategori' ? 'active' : ''}">
                            <a th:href="@{/category}"><i class="bi bi-tags"></i><span>Kategori Produk</span> </a>
                        </li>
                        <li class="sidebar-item" th:classappend="${activeMenu == 'pegawai' ? 'active' : ''}">
                            <a th:href="@{/admin/pegawai}"><i class="bi bi-people"></i><span>Kelola Kasir</span></a>
                        </li>
                        <li class="sidebar-item" th:classappend="${activeMenu == 'laporan' ? 'active' : ''}">
                            <a th:href="@{/admin/laporan}"><i class="bi bi-bar-chart-line"></i><span>Laporan</span></a>
                        </li>
                    </ul>
                </div>
            </div>
        </div>
    </aside>

    <div th:fragment="overlay" class="sidebar-overlay" id="sidebarOverlay"></div>

    <th:block th:fragment="header(pageTitle=null, pageSubtitle=null)">
        <header class="admin-header">
            <div class="header-left">
                <button class="btn-hamburger" id="hamburgerBtn" type="button" aria-label="Menu"><i class="bi bi-list"></i></button>
            </div>
            <div class="header-right">
                <div class="date-badge">
                    <i class="bi bi-calendar3"></i>
                    <span id="currentDateText"></span>
                </div>
                <div class="dropdown">
                    <div class="header-user-badge" data-bs-toggle="dropdown" aria-expanded="false" role="button">
                        <img th:if="${currentUser != null and currentUser.foto != null and !currentUser.foto.isEmpty()}" th:src="@{'/uploads/profil/' + ${currentUser.foto}}" alt="Foto Profil" class="user-avatar-mini-img">
                        <div th:unless="${currentUser != null and currentUser.foto != null and !currentUser.foto.isEmpty()}" class="user-avatar-mini" th:text="${currentUser != null and currentUser.username != null and !currentUser.username.isEmpty() ? #strings.substring(currentUser.username, 0, 1).toUpperCase() : 'A'}">A</div>
                        <span class="user-chip-name" th:text="${currentUser != null and currentUser.username != null ? currentUser.username : 'Admin'}">Admin</span>
                        <i class="bi bi-chevron-down" style="font-size: 11px; color: var(--veyro-text-muted); margin-left: 2px;"></i>
                    </div>
                    <ul class="dropdown-menu dropdown-menu-end" style="border-radius: 10px; border: 1px solid var(--veyro-border); padding: 6px; min-width: 150px; box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08); margin-top: 8px;">
                        <li>
                            <form th:action="@{/logout}" method="post" style="margin: 0;">
                                <button type="submit" class="dropdown-item d-flex align-items-center gap-2" style="border-radius: 7px; font-size: 13px; font-weight: 600; color: #dc2626; padding: 8px 12px;">
                                    <i class="bi bi-box-arrow-right"></i>
                                    <span>Logout</span>
                                </button>
                            </form>
                        </li>
                    </ul>
                </div>
            </div>
        </header>
    </th:block>

    <div th:fragment="notifikasi" class="veyro-toast-container">
        <th:block th:if="${pesanSukses != null or pesanError != null}">
            <th:block th:if="${pesanSukses != null}">
                <div th:with="tipeFinal=${tipeNotif != null ? tipeNotif : (#strings.contains(pesanSukses.toLowerCase(), 'hapus') ? 'hapus' : (#strings.contains(pesanSukses.toLowerCase(), 'perbarui') or #strings.contains(pesanSukses.toLowerCase(), 'update') ? 'update' : 'tambah'))}" class="veyro-toast" th:classappend="'toast-' + ${tipeFinal}">
                    <div class="veyro-toast-icon">
                        <i th:if="${tipeFinal == 'tambah'}" class="bi bi-check2-circle"></i>
                        <i th:if="${tipeFinal == 'update'}" class="bi bi-pencil-square"></i>
                        <i th:if="${tipeFinal == 'hapus'}" class="bi bi-trash3-fill"></i>
                    </div>
                    <div class="veyro-toast-body">
                        <span class="veyro-toast-tag" th:text="${tipeFinal == 'tambah' ? 'Berhasil Ditambahkan' : (tipeFinal == 'update' ? 'Berhasil Diperbarui' : 'Berhasil Dihapus')}">Berhasil</span>
                        <p class="veyro-toast-msg" th:text="${pesanSukses}">Pesan sukses</p>
                    </div>
                    <button type="button" class="veyro-toast-close" aria-label="Tutup"><i class="bi bi-x-lg"></i></button>
                    <div class="veyro-toast-progress"></div>
                </div>
            </th:block>

            <th:block th:if="${pesanError != null}">
                <div class="veyro-toast toast-error">
                    <div class="veyro-toast-icon">
                        <i class="bi bi-exclamation-triangle-fill"></i>
                    </div>
                    <div class="veyro-toast-body">
                        <span class="veyro-toast-tag">Terjadi Kesalahan</span>
                        <p class="veyro-toast-msg" th:text="${pesanError}">Pesan error</p>
                    </div>
                    <button type="button" class="veyro-toast-close" aria-label="Tutup"><i class="bi bi-x-lg"></i></button>
                    <div class="veyro-toast-progress"></div>
                </div>
            </th:block>
        </th:block>
    </div>

    <th:block th:fragment="scripts">
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
        <script>
            document.addEventListener('DOMContentLoaded', function () {
                const hamburgerBtn = document.getElementById('hamburgerBtn');
                const adminSidebar = document.getElementById('adminSidebar');
                const sidebarOverlay = document.getElementById('sidebarOverlay');

                if (hamburgerBtn && adminSidebar && sidebarOverlay) {
                    hamburgerBtn.addEventListener('click', function () {
                        adminSidebar.classList.toggle('show');
                        sidebarOverlay.classList.toggle('show');
                    });

                    sidebarOverlay.addEventListener('click', function () {
                        adminSidebar.classList.remove('show');
                        sidebarOverlay.classList.remove('show');
                    });
                }

                const dateEl = document.getElementById('currentDateText');
                if (dateEl) {
                    const options = { weekday: 'long', year: 'numeric', month: 'short', day: 'numeric' };
                    dateEl.textContent = new Date().toLocaleDateString('id-ID', options);
                }

                document.querySelectorAll('.veyro-toast').forEach(function (toast) {
                    let timer = setTimeout(function () {
                        tutupToast(toast);
                    }, 4000);

                    toast.addEventListener('mouseenter', function () {
                        clearTimeout(timer);
                        const progress = toast.querySelector('.veyro-toast-progress');
                        if (progress) progress.style.animationPlayState = 'paused';
                    });

                    toast.addEventListener('mouseleave', function () {
                        const progress = toast.querySelector('.veyro-toast-progress');
                        if (progress) progress.style.animationPlayState = 'running';
                        timer = setTimeout(function () {
                            tutupToast(toast);
                        }, 1800);
                    });

                    const closeBtn = toast.querySelector('.veyro-toast-close');
                    if (closeBtn) {
                        closeBtn.addEventListener('click', function () {
                            clearTimeout(timer);
                            tutupToast(toast);
                        });
                    }
                });

                function tutupToast(toast) {
                    toast.classList.add('hide');
                    setTimeout(function () {
                        if (toast && toast.parentNode) {
                            toast.parentNode.removeChild(toast);
                        }
                    }, 350);
                }
            });
        </script>
    </th:block>

</body>

</html>
