<!DOCTYPE html>
<html lang="id" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Laporan Penjualan - Veyro</title>
    <link rel="icon" type="image/png" th:href="@{/images/logoBrow.png}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/admin.css}">
</head>

<body>

    <div class="admin-layout">
        <div th:replace="~{admin/fragments :: sidebar('laporan')}"></div>
        <div th:replace="~{admin/fragments :: overlay}"></div>

        <div class="admin-main">
            <div
                th:replace="~{admin/fragments :: header('Laporan Penjualan', 'Analisis performa omzet dan rangkuman penjualan')}">
            </div>

            <div class="admin-content">
                <div class="content-card">
                    <div class="card-header-clean">
                        <div class="card-title-group">
                            <h3 class="card-title">Ringkasan Laporan</h3>
                            <p class="card-subtitle">Statistik transaksi penjualan berkala</p>
                        </div>
                    </div>

                    <div class="empty-state">
                        <div class="empty-icon text-mint"><i class="bi bi-bar-chart-line"></i></div>
                        <div class="empty-title">Modul Laporan Penjualan</div>
                        <div class="empty-subtitle">Fitur rekapitulasi harian, bulanan, dan ekspor data akan aktif di
                            tahap selanjutnya.</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <th:block th:replace="~{admin/fragments :: scripts}"></th:block>

</body>

</html>
